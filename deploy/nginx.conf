# ARTEX 前端容器 nginx 配置（前后端分离模式）。
# 职责：托管 Next 静态导出，并把 /api 反向代理到后端 api 容器。
server {
    listen 80;
    server_name _;
    # 用变量形式 proxy_pass 时必须显式指定 resolver（Docker 内置 DNS）。
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 gzip（_next 产物多为 js/css）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端 SPA + 按路由导出的 index.html，兜底到根 index.html（与后端 webuiHandler 逻辑一致）
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # API 反代到后端 api 服务。用变量形式延迟解析上游地址，避免 api 容器尚未启动时
    # nginx 因 "host not found in upstream" 而退出。
    location /api/ {
        set $backend http://api:8787;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/logs/stream 等）：关闭缓冲、关闭缓存、拉长读写超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
